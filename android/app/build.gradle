plugins { id 'com.android.application' }

// Release signing reads android/keystore.properties (never committed):
//   storeFile=/absolute/path/release.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'org.fable2.recomp'
    compileSdk 35
    defaultConfig {
        applicationId 'org.fable2.recomp'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
    sourceSets.main {
        java.srcDir '../../thirdparty/rexglue-sdk/thirdparty/sdl3/android-project/app/src/main/java'
        jniLibs.srcDir 'src/main/jniLibs'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = "Fable2-Android-${variant.versionName}-${variant.buildType.name}.apk" }
    }
}
